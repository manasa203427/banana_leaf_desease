{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banana Disease Detection - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script>
function validate(formObj)
{
    if(formObj.t1.value.length==0)
    {
        alert("Please Enter Username");
        formObj.t1.focus();
        return false;
    }
    if(formObj.t2.value.length==0)
    {
        alert("Please Enter Password");
        formObj.t2.focus();
        return false;
    }
    return true;
}
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* ===== Background ===== */
body{
    background:url("{% static 'images/banana_bg.jpg' %}") no-repeat center center/cover;
    height:100vh;
}

/* ===== Header ===== */
#header{
    background:rgba(0,0,0,0.75);
    padding:20px;
    text-align:center;
    color:white;
}

#menu ul{
    list-style:none;
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:10px;
}

#menu ul li a{
    text-decoration:none;
    color:white;
    padding:8px 18px;
    border-radius:25px;
    transition:0.3s;
}

#menu ul li a:hover{
    background:#4CAF50;
}

/* ===== Login Container ===== */
#wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    height:75vh;
}

#page{
    background:rgba(255,255,255,0.95);
    padding:40px;
    width:400px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

/* ===== Form Styling ===== */
h2{
    color:#2e7d32;
    margin-bottom:20px;
}

input[type=text],
input[type=password]{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

input[type=submit]{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

input[type=submit]:hover{
    background:#2e7d32;
}

.message{
    color:blue;
    margin-bottom:10px;
}

.forgot{
    margin-top:15px;
}

.forgot a{
    text-decoration:none;
    color:#2e7d32;
    font-size:14px;
}

.forgot a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<!-- ===== Header ===== -->
<div id="header">
    <h1>Banana Leaf Disease Detection using ML & Computer Vision</h1>

    <div id="menu">
        <ul>
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'UserLogin' %}">User Login</a></li>
            <li><a href="{% url 'Register' %}">Registration</a></li>
        </ul>
    </div>
</div>

<!-- ===== Login Form ===== -->
<div id="wrapper">
<div id="page">

<form name="f1" method="post"
      action="{% url 'UserLoginAction' %}"
      onsubmit="return validate(this)">

{% csrf_token %}

<h2>User Login</h2>

<div class="message">
    {{ data|safe }}
</div>

<input type="text" name="t1" placeholder="Enter Username">
<input type="password" name="t2" placeholder="Enter Password">

<input type="submit" value="Login">

<div class="forgot">
    <a href="ForgotPassword">Forgot Password?</a>
</div>

</form>

</div>
</div>

</body>
</html>
