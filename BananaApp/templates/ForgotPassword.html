{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* ===== Background ===== */
body{
    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("{% static 'images/banana_bg.jpg' %}");
    background-size:cover;
    background-position:center;
}

/* ===== Header ===== */
#header{
    background:rgba(0,0,0,0.8);
    padding:18px;
    text-align:center;
    color:white;
    font-size:22px;
    font-weight:600;
}

/* ===== Menu ===== */
#menu{
    background:rgba(0,0,0,0.85);
    text-align:center;
    padding:10px;
}

#menu a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    padding:6px 14px;
    border-radius:20px;
    transition:0.3s;
    font-size:15px;
}

#menu a:hover{
    background:#4CAF50;
}

/* ===== Wrapper ===== */
#wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
}

/* ===== Card ===== */
.card{
    background:rgba(255,255,255,0.96);
    padding:30px;
    width:360px;
    border-radius:15px;
    box-shadow:0 10px 28px rgba(0,0,0,0.3);
    text-align:center;
}

/* ===== Heading ===== */
h2{
    color:#2e7d32;
    margin-bottom:15px;
}

/* ===== Input ===== */
input[type=email]{
    width:100%;
    padding:10px;
    margin-top:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

/* ===== Button ===== */
input[type=submit]{
    width:100%;
    padding:10px;
    margin-top:18px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

input[type=submit]:hover{
    background:#2e7d32;
}

</style>
</head>

<body>

<!-- ===== Header ===== -->
<div id="header">
Banana Leaf Disease Detection System
</div>

<!-- ===== Navigation ===== -->
<div id="menu">
<a href="{% url 'index' %}">Home</a>
<a href="{% url 'UserLogin' %}">User Login</a>
<a href="{% url 'Register' %}">Registration</a>
<a href="{% url 'ForgotPassword' %}">Forgot Password</a>
</div>

<!-- ===== Forgot Password Card ===== -->
<div id="wrapper">
<div class="card">

<h2>Forgot Password</h2>

<form action="{% url 'ForgotPasswordAction' %}" method="post">
{% csrf_token %}

<p>Enter your registered email address</p>

<input type="email" name="email" placeholder="Email Address" required>

<input type="submit" value="Send Password">

</form>

</div>
</div>

</body>
</html>
